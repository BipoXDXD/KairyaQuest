name: focusquest

services:
  postgres:
    # Versao fixada: o README s10 proibe `latest`.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: focusquest
      POSTGRES_PASSWORD: focusquest_local
      POSTGRES_DB: focusquest
    ports:
      # Porta do host configuravel, com 55432 de padrao: a 5432 esta ocupada
      # por uma instalacao local do PostgreSQL que NAO pertence a este projeto
      # (README s10: "recuse alvos de desenvolvimento ou producao"). Se a 55432
      # tambem estiver ocupada, troque FOCUSQUEST_DB_PORT no .env.
      - "127.0.0.1:${FOCUSQUEST_DB_PORT:-55432}:5432"
    volumes:
      # A partir da imagem 18, o entrypoint espera o volume montado no
      # diretorio pai (/var/lib/postgresql), nao mais em .../data: montar em
      # .../data faz o entrypoint abortar com "unused mount/volume", mesmo
      # com o volume vazio (docker-library/postgres#1259). O brief original
      # usava o caminho antigo; corrigido aqui para a imagem realmente subir.
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      # Healthcheck de verdade, nao `sleep` (README s10).
      # -h 127.0.0.1 de proposito: durante o initdb o entrypoint sobe um
      # servidor temporario com listen_addresses='' que ja atende no socket
      # Unix, enquanto os scripts de /docker-entrypoint-initdb.d/ ainda rodam.
      # Sem o -h, o healthcheck aprova antes de focusquest_test existir, e
      # `make db-up --wait` devolve o controle cedo demais.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U focusquest -d focusquest"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
