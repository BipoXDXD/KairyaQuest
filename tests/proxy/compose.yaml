services:
  api:
    image: ${PROXY_TEST_PYTHON_IMAGE:?}
    command: ["python", "/probe/upstream.py"]
    volumes:
      - ./upstream.py:/probe/upstream.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from socket import create_connection; create_connection(('127.0.0.1', 8000), 1).close()"]
      interval: 1s
      timeout: 2s
      retries: 15

  proxy:
    image: ${PROXY_TEST_NGINX_IMAGE:?}
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ../../docker/nginx.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - source: synthetic_access
        target: access.htpasswd
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "1", "127.0.0.1", "8080"]
      interval: 1s
      timeout: 2s
      retries: 15

  client:
    image: ${PROXY_TEST_PYTHON_IMAGE:?}
    command: ["python", "/probe/probe.py", "-v"]
    volumes:
      - ./probe.py:/probe/probe.py:ro

secrets:
  synthetic_access:
    file: ./synthetic-access.fixture

networks:
  default:
    internal: true
