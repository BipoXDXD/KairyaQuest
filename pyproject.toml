[project]
name = "focusquest"
version = "0.1.0"
description = "Plataforma de estudos gamificada com tutoria interativa"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "anthropic==1.11.0",
    "anyio==4.15.1",
    "fastapi==0.142.2",
    "httpx2==2.13.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.3",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/focusquest"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]
# A documentacao mostra codigo deliberadamente errado -- exemplos de defeito
# que o gate deve reprovar. Um formatador que "conserta" esses exemplos
# destroi o que eles ensinam. O Ruff 0.16+ formata blocos Python dentro de
# Markdown por padrao, entao docs/ fica fora do escopo dele.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
# Sem o plugin, o mypy strict trata BaseSettings como um __init__ comum e
# exige database_url/test_database_url como argumentos nomeados em toda
# chamada a Settings() -- mesmo eles vindo do ambiente. O plugin ensina o
# mypy a entender os campos do pydantic.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# APIs obsoletas do SQLAlchemy usadas pela aplicacao reprovam o gate.
filterwarnings = ["error::sqlalchemy.exc.SADeprecationWarning:focusquest[.]"]

[tool.coverage.run]
branch = true
source = ["src/focusquest"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
